AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  Exclude:
    - 'test/dummy/**/*'
    - 'vendor/**/*'
    - 'bin/**/*'

Style/Documentation:
  Enabled: false

Style/StringLiterals:
  Enabled: true
  EnforcedStyle: double_quotes

Layout/LineLength:
  Max: 120

# Relax metrics for test files, generators, and the admin screen catalog.
Metrics/ClassLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_ai/admin_screens.rb'
    - 'lib/recording_studio_ai/models/definition.rb'

Metrics/ModuleLength:
  Exclude:
    - 'lib/recording_studio_ai/admin_screens.rb'

Metrics/MethodLength:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_ai/admin_screens.rb'
    - 'lib/recording_studio_ai/models/definition.rb'

Metrics/AbcSize:
  Exclude:
    - 'test/**/*'
    - 'lib/generators/**/*'
    - 'lib/recording_studio_ai/admin_screens.rb'
    - 'lib/recording_studio_ai/models/definition.rb'

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'
    - 'lib/recording_studio_ai/admin_screens.rb'

Metrics/CyclomaticComplexity:
  Exclude:
    - 'lib/recording_studio_ai/admin_screens.rb'
    - 'lib/recording_studio_ai/models/definition.rb'

Metrics/PerceivedComplexity:
  Exclude:
    - 'lib/recording_studio_ai/admin_screens.rb'
    - 'lib/recording_studio_ai/models/definition.rb'

Metrics/ParameterLists:
  Exclude:
    - 'lib/recording_studio_ai/models/definition.rb'

# Model catalog files are keyed by the provider model slug (dots become hyphens),
# so their filenames are intentionally not snake_case.
Naming/FileName:
  Exclude:
    - 'lib/recording_studio_ai/models/*/*.rb'

# Allow empty blocks in tests (common for stubs/mocks)
Lint/EmptyBlock:
  Exclude:
    - 'test/**/*'

# Allow nested method definitions in tests (common for testing behavior)
Lint/NestedMethodDefinition:
  Exclude:
    - 'test/**/*'

# Allow underscores in test method names (test_something_100 is fine)
Naming/VariableNumber:
  Exclude:
    - 'test/**/*'
